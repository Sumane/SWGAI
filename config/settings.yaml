# =============================================================================
# JedAI settings
#
# This is the ONE place to change paths, screen, planet, keys and tuning.
# Don't edit this file for your own machine. Instead, copy the lines you want
# to change into  config/settings.local.yaml  (it's git-ignored) and change
# them there. Anything you leave out keeps the value below.
#
# Relative paths are relative to the repo folder (the one with README.md).
# Absolute paths work too, e.g.  data_dir: "E:/label_work"
# =============================================================================

paths:
  models_dir: models            # each model lives in <models_dir>/<name>/weights/best.pt
  data_dir: data                # datasets, screenshots, training runs (git-ignored)
  nav_db: data/jedai_nav_v2.db  # the navigation grid map (SQLite). v2 (8 Nov): fresh, 2 m cells
  command_file: data/nav_state.json   # navigator -> controller command channel
  debug_dir: data/debug_logs
  harness_dir: data/harness     # harness world state + skill logs
  vehicles: config/vehicles.json      # vehicle speed calibration (speedometer writes here)

screen:
  monitor_index: 2              # which monitor the game is on (mss numbering, 1 = primary)
                                # Linux with the game in its own X display: use 1

platform:
  input_backend: auto           # auto | pydirectinput (Windows) | xtest (Linux, X11 / Xwayland)
  x_display: ""                 # Linux: X display the game runs on, e.g. ":2" (scripts/linux/start_swg.sh).
                                # Keys are sent to and screenshots taken from this display only.
                                # "" = use $DISPLAY

game:
  planet: naboo                 # grid map is stored per planet
  hud_toggle_keys: [shift, ctrl, h]   # hides/shows the whole HUD (depth frames need it hidden)

# The 8 YOLO models the navigator uses (folder names under models_dir)
models:
  group:    wp_group_v0101              # waypoint list window
  panel:    wp_panel_v2_production3     # one waypoint row
  comp:     wp_components_v3            # name / distance inside a row
  arrow:    wp_direction_v2_final       # waypoint arrow (relative bearing!)
  wp_digit: wp_distance                 # distance digits
  minimap:  mini_map_v01.00             # minimap
  coords:   player_coord_v1.01          # x/y/z fields under the minimap
  co_digit: white_on_teal_digits_v01.00 # coordinate digits

# Logical key -> physical key (pydirectinput names). Used by the controller.
keys:
  LEFT: left
  RIGHT: right
  AUTORUN: numlock
  FORWARD: up
  BACK: down
  kill: f8                      # stops both navigator and controller

navigation:
  loop_interval: 0.05           # seconds between main loop ticks
  default_vehicle: swoop

  # Run recording (debugging): each run gets a folder under paths.debug_dir with
  # every tick, every event, screenshots and report.html (open it in a browser)
  record_runs: true
  record_shot_every_s: 5.0      # plus a screenshot at every event (stuck, unstick, dismount...)
  abort_if_further_m: 300       # watchdog: stop if this much further than its closest so far (0 = off)

  # Arrival
  stop_dist: 50                 # metres: arrived (on a vehicle), after verify_readings in a row
  stop_dist_on_foot: 10         # metres: arrived when walking/running
  remount_after_m: 40           # after a stuck-dismount, get back on once this far from the spot
  remount_min_dist: 150         # ...unless the target is closer than this (walk the rest)
  remount_progress_m: 30        # ...and only once it's this much closer to the target (past the obstacle)
  remount_max_per_run: 3
  final_creep_dist_on_foot: 0   # on foot: no stop-start creeping at the end
  approach_dist_on_foot: 30     # on foot, closer than this: turn on the spot to the arrow, then step (0 = off)
  verify_readings: 5            # consecutive close readings = arrived
  final_creep_dist: 20          # metres: pulse forward instead of holding
  creep_pulse_on: 0.8
  creep_pulse_off: 0.15

  # Vision
  fuzzy_threshold: 0.5          # waypoint name match ratio
  ocr_stale_limit: 15.0         # seconds without a distance before re-aligning
  scan_steps: 4                 # turns during the initial waypoint scan
  scan_turn_time: 0.9
  scan_settle: 0.4
  tab_in_pause: 4               # seconds to switch focus back to the game
  max_coord_jump: 50.0          # metres: ignore coordinate readings that jump further

  # Movement / grid
  corridor_width: 5.0
  clear_hz: 2.0                 # how often CLEAR cells are stamped (per second)
  recal_attempt_secs: 3.0       # seconds trying a neighbour cell before marking it blocked
  explore_turn_secs: 1.5
  explore_hold_secs: 2.0
  explore_leg_m: 20.0           # cross-exploration leg length
  explore_leg_secs: 4.0
  cell_size: 2.0                # must match planner.resolution_m
  map_only_when_stuck: true     # 8 Nov: navmesh is the map; record cells only where the bot gets stuck
  two_strikes: true             # 1st bump in a cell = suspect (dear), 2nd = blocked
  blame_max_angle_deg: 180      # only blame a cell faced within this angle. 180 = off: the heading comes
                                # from movement, so it's stale after an unstick turn (sim got worse with 30)
  stop_speed_ratio: 0.10        # below this fraction of max speed = stopped
  stop_debounce: 3              # consecutive stopped ticks before recalibrating
  steer_deadband: 0.15          # sin(angle) below which the bot drives straight
  pivot_deg: 100.0              # D* direction this far off: stop and turn on the spot
  steer_gain: 0.6               # turn tap = gain x (degrees off) / turn_rate_deg_s ...
  steer_max_tap_secs: 0.8       # ... capped at this
  steer_lookahead_cells: 3      # steer at a point this many cells along the D* path, not the next cell
  turn_rate_deg_s: 100.0        # how fast LEFT/RIGHT turn (scan_turn_time 0.9 s x 4 steps ~ 360°)
  unstick_back_secs: 1.0        # stuck: reverse this long,
  unstick_forward_secs: 2.0     #   turn 45° (wider if it keeps happening), drive this long
  unstick_escape_secs: 2.0      #   then this long before D* steers again
  wall_follow: false            # stuck: follow the wall (angled into it). OFF: in-game it drove big circles
  follow_angle_deg: 60.0        #   turn this far from facing the wall (90 = parallel)
  follow_secs: 30.0             #   give up following after this long
  backtrack_after_stuck: 0      # stuck this often in one place: go back the way it came (0 = off)
  backtrack_m: 40.0             #   this far along its track (more each time)
  backtrack_secs: 25.0          #   giving up after this long
  heading_min_move_m: 3.0       # heading from moves at least this long (coords are whole metres)
  grind_window_s: 6.0           # moving but covered less than grind_min_m in this long = stuck
  grind_min_m: 8.0              #   (the game slides you along walls, so speed alone misses it)

  # Target estimate: trilateration from (position, distance) readings every few metres
  estimate_spacing_m: 5.0       # take a reading every this many metres
  estimate_dist_sigma_m: 3.0    # distance noise (integer metres + mounted coordinate lag)
  estimate_confident_m: 25.0    # D* follows the estimate once it's this sure (or 4% of the range)
  goal_move_m: 20.0             # move the D* goal when the estimate shifts more than this (or 2%)
  dstar_horizon_m: 300.0        # far targets: D* plans to a point this far along the way
  # Which way the RIGHT key turns the heading in X/Z coordinates.
  #  -1 = RIGHT turns clockwise (X = east, Z = north). MEASURED in-game 27 Oct 2026
  #       with scripts/check_turn_direction.py: 3/3 trials.
  #   1 = what the original v0.20 code assumed, so its D* steering turned the
  #       wrong way. That's the likely reason none of its 13 logged runs completed.
  right_turn_sign: -1

  # Mounted vs on foot. A cell the bot drove through is CLEAR however fast it
  # went, so CLEAR is always recorded. BLOCKED is only recorded on foot: a vehicle
  # takes metres to stop and slides along walls, so it can't say which cell stopped it.
  on_foot_vehicles: [walking, running]
  mounted_mapping: clear_only   # clear_only (default) | none = nothing while mounted | all = old behaviour
  foot_vehicle: running         # profile to switch to after dismounting
  dismount_after_stuck: 2       # stuck this many times in the same place on a vehicle -> dismount
  unseal_radius_m: 50           # D* finds no route at all: forget blocked cells this close and replan
  trapped_after_stuck: 12       # stuck this many times within trapped_radius_m -> give the run up
  trapped_radius_m: 8.0
  area_radius_m: 120.0          # boxed in -> map a circle this big on its own D* layer
  chat_watch_s: 6.0             # OCR the chat window this often for attacks / incapacitation / death (0 = off)
  height_jump_m: 4.0            # height logged, not used yet: a change bigger than this per read is flagged
  height_crop_every_s: 2.0      # ...with a crop of the coordinate readout, at most this often
  height_crops_max: 150
  stuck_window_s: 300.0         # ...counting stuck points from the last 5 minutes
  stuck_radius_m: 40.0          # "same place" = within this distance of the last stuck point
                                # (an unstick manoeuvre itself moves the bot 10-30 m)
  dismount_method: command      # command: types dismount_command in chat | key: presses dismount_key
  dismount_command: /dismount
  dismount_key: ""              # e.g. the toolbar key you put your vehicle on
  dismount_settle_secs: 2.0     # wait for the dismount animation

planner:
  cost_clear: 1.0
  # 3.0 makes the planner prefer known-clear cells. The code review suspected
  # this caused backward routing, but in the simulator (tests/test_simulated_drive.py)
  # 1.0 was clearly worse: it failed walls that 3.0 got round. Keep 3.0.
  cost_unexplored: 3.0
  cost_near_blocked: 10.0       # unexplored cell next to a known blocked one (walls are long)
  # Variant switch. false = navmesh-free (default): the bot only knows what it
  # has seen. true = Core3 navmesh maps price unexplored cells (comparison runs).
  navmesh_prior: true           # 8 Nov (Marc): navmesh on as the base map
  navmesh_prior_dir: data/navmesh_priors
  cost_prior_blocked: 30.0      # unexplored cell the navmesh says is not walkable
  cost_suspect: 15.0            # a cell bumped into once
  resolution_m: 2               # D* / map cell size (was 5: one bump walled off narrow stairs)
  search_radius_m: 150.0        # D* goal ("carrot") at most this far ahead (2 m cells: keep it small)
  bound_margin_m: 200.0         # D* searches the start-goal box plus this much round it (room to go round long walls)
  goal_reach_m: 8.0

tools:
  tesseract_cmd: ""             # only for tools/validation/test_hud_ocr.py, e.g. "E:/New folder/tesseract.exe"
  label_studio_exe: ""          # only for tools/labeling/label_studio.bat

# Harness v0 (scripts/run_harness.py)
harness:
  waypoint_command: "/waypoint {x:.0f} {z:.0f} {label}"   # confirm the exact syntax in-game
  waypoint_settle_s: 1.5
  mount_key: F1            # toolbar key that calls the vehicle; empty = mount skill disabled
  mount_settle_s: 3.0         # in a city the vehicle is out at once
  vehicle_call_delay_s: 16    # outside cities/camps the server takes 15 s (Core3 VehicleControlDevice); the bot
                              # waits for the "calling vehicle in 15 seconds" chat line, or this long if chat is unreadable
  mount_commands: ["/tar speederbike swoop", "/mount"]   # full name: "/tar spe" targeted a nearby speaker
  mount_command_gap_s: 1.0
  store_key: F1            # pressed after every dismount to store the vehicle (same key toggles it)
  store_settle_s: 1.5
  start_mounted: false     # first run only; after that the harness remembers
  # Marc, 7 Nov: keep going until the badge is earned; failures are data.
  max_badge_failures: 1000       # attempts per badge before System 2 skips it
  max_consecutive_failures: null # null = never stop the session for failures
  stop_on_exception: false       # a crashed skill is logged and the next attempt starts
  # The client's chat log (/logChat, switched on at the start of each session).
  # Read directly instead of OCR'ing the chat window. Newest match = current character.
  chatlog_glob: "/mnt/storage/Swgemu/profiles/*/Core3/*_chatlog.txt"
  datapad_keys: [CTRL, d]                        # opens/closes the datapad (Marc's binding)
  bot_waypoint_prefixes: [badge_, route_, bot_]  # clean_waypoints only deletes these
  chatlog_watch: true          # keep /logChat ON: checked in the chat window at start and between steps
  chatlog_check_min: 10        # re-check this often (types /logChat, reads ON/OFF, fixes it)
  chatlog_trust_s: 120         # a new harness process trusts a check younger than this
  recover_from_death: true     # on death: clone (pre-designated facility) and walk the recorded route out
  clone_load_wait_s: 60        # longest wait for the loading screen after cloning
  shuttle_wait_s: 420          # travel_to: keep trying /boardShuttle this long (shuttles land every few minutes)
  clean_waypoints_every: 1                       # badge trips between datapad clean-ups; 0 = off
  verify_badges: true      # only count a badge when a new "badge" line shows in chat
  badge_message_wait_s: 2.5
  force_mounted: null      # null = trust the remembered state; true/false = override it every start
                           # one-off fix instead: write true/false into data/live/SET_MOUNTED
  # harness_live: named full-resolution crops saved next to the tiles, as
  # fractions (x0, y0, x1, y1) of the frame. Positions from Marc's 2560x1440 layout.
  screen_regions:
    chat: [0.21, 0.80, 0.73, 0.99]
    minimap: [0.0, 0.69, 0.11, 0.99]
    centre: [0.30, 0.25, 0.70, 0.80]
    waypoints: [0.88, 0.25, 1.0, 0.36]
  cuda_visible_devices: "0"   # harness_live: run vision on GPU 0 (the 3060, PCI order) so the
                              # local LLM on the 5070 Ti keeps its VRAM. "" = don't restrict
